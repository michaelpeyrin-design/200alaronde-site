[build]
  command = "python build.py && python verify_seo.py"
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/pages/le-groupe"
  to = "/pages/documents"
  status = 301

[[redirects]]
  from = "/pages/le-groupe.html"
  to = "/pages/documents.html"
  status = 301
