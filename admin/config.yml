backend:
  name: github
  repo: michaelpeyrin-design/200alaronde-site
  branch: main

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
logo_url: "/assets/img/logo-200alaronde.png"

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "content/articles"
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{date}} - {{title}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Adresse / slug", name: "slug", widget: "string", hint: "Exemple : dodecaudax-septembre-2026"}
      - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - label: "Catégorie"
        name: "category"
        widget: "select"
        options: ["Dodecaudax", "BRM", "Longue distance", "Artisan cadreur", "Lecture", "Association"]
      - {label: "Résumé", name: "summary", widget: "text", required: false}
      - {label: "Titre SEO (Google)", name: "seo_title", widget: "string", required: false, hint: "Facultatif. Laissez vide pour utiliser automatiquement le titre de l’article."}
      - {label: "Description SEO (Google)", name: "seo_description", widget: "text", required: false, hint: "Facultatif. Environ 140 à 160 caractères. Laissez vide pour utiliser le résumé."}
      - {label: "Image principale", name: "featured_image", widget: "image", required: false}
      - {label: "Publié", name: "published", widget: "boolean", default: true}
      - {label: "Afficher dans Archives", name: "show_in_archives", widget: "boolean", default: false, hint: "Activez uniquement pour les sorties à afficher dans la page Archives."}
      - {label: "Contenu", name: "body", widget: "markdown"}
      - label: "GALERIES PHOTOS — Mosaïque / Carrousel"
        name: "galleries"
        widget: "list"
        required: false
        minimize_collapsed: true
        summary: "{{fields.type}} — {{fields.title}}"
        hint: "Ajoutez une ou plusieurs galeries. Choisissez Mosaïque ou Carrousel puis ajoutez les photos."
        fields:
          - label: "Présentation"
            name: "type"
            widget: "select"
            default: "mosaic"
            options:
              - {label: "Mosaïque", value: "mosaic"}
              - {label: "Carrousel", value: "carousel"}
          - {label: "Titre de la galerie", name: "title", widget: "string", required: false}
          - label: "Nombre de colonnes (mosaïque)"
            name: "columns"
            widget: "select"
            default: "3"
            required: false
            options:
              - {label: "2 colonnes", value: "2"}
              - {label: "3 colonnes", value: "3"}
              - {label: "4 colonnes", value: "4"}
          - label: "Photos"
            name: "images"
            widget: "list"
            required: true
            minimize_collapsed: true
            summary: "{{fields.caption}}"
            fields:
              - {label: "Photo", name: "src", widget: "image"}
              - {label: "Légende", name: "caption", widget: "string", required: false}
              - {label: "Texte alternatif", name: "alt", widget: "string", required: false}

  - name: "sorties_mensuelles"
    label: "Sorties du mois"
    files:
      - name: "nos_sorties"
        label: "Encarts des sorties"
        file: "content/pages/nos-sorties.json"
        format: "json"
        fields:
          - {label: "Titre de la page", name: "title", widget: "string"}
          - {label: "Adresse / slug", name: "slug", widget: "hidden", default: "nos-sorties"}
          - {label: "Libellé menu", name: "menu_label", widget: "hidden", default: "À venir"}
          - {label: "Publié", name: "published", widget: "hidden", default: true}
          - {label: "Introduction", name: "intro", widget: "text"}
          - label: "Inscriptions AssoConnect par mois"
            name: "months"
            widget: "list"
            summary: "{{fields.name}}"
            minimize_collapsed: true
            fields:
              - {label: "Numéro du mois", name: "month", widget: "hidden"}
              - {label: "Mois", name: "name", widget: "string"}
              - {label: "Activer le bouton Inscription AssoConnect", name: "registration_open", widget: "boolean", default: false, required: false}
              - {label: "Lien d'inscription AssoConnect", name: "registration_url", widget: "string", required: false, hint: "Collez ici le lien AssoConnect. Le bouton n'est affiché que si l'option ci-dessus est activée."}
          - {label: "Note sous les encarts", name: "departure_note", widget: "text", required: false}
          - {label: "Titre SEO (Google)", name: "seo_title", widget: "string", required: false}
          - {label: "Description SEO (Google)", name: "seo_description", widget: "text", required: false}
          - {label: "Ancien contenu", name: "body", widget: "hidden", required: false}

  - name: "gravel_mensuel"
    label: "Gravel - calendrier"
    files:
      - name: "gravel"
        label: "Sorties Gravel"
        file: "content/pages/gravel.json"
        format: "json"
        fields:
          - {label: "Titre de la page", name: "title", widget: "string"}
          - {label: "Adresse / slug", name: "slug", widget: "hidden", default: "gravel"}
          - {label: "Libellé menu", name: "menu_label", widget: "hidden", default: "Gravel"}
          - {label: "Publié", name: "published", widget: "hidden", default: true}
          - {label: "Introduction", name: "intro", widget: "text"}
          - label: "Inscriptions par mois"
            name: "months"
            widget: "list"
            summary: "{{fields.name}}"
            minimize_collapsed: true
            fields:
              - {label: "Numéro du mois", name: "month", widget: "hidden"}
              - {label: "Mois", name: "name", widget: "string"}
              - {label: "Lien d'inscription", name: "registration_url", widget: "string", required: false}
          - {label: "Note sous les encarts", name: "departure_note", widget: "text", required: false}
          - {label: "Titre SEO (Google)", name: "seo_title", widget: "string", required: false}
          - {label: "Description SEO (Google)", name: "seo_description", widget: "text", required: false}
          - {label: "Ancien contenu", name: "body", widget: "hidden", required: false}

  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "content/pages"
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Adresse / slug", name: "slug", widget: "string"}
      - {label: "Libellé menu", name: "menu_label", widget: "string", required: false}
      - {label: "Titre SEO (Google)", name: "seo_title", widget: "string", required: false}
      - {label: "Description SEO (Google)", name: "seo_description", widget: "text", required: false}
      - {label: "Publié", name: "published", widget: "boolean", default: true}
      - {label: "Contenu", name: "body", widget: "markdown"}
